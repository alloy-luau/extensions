name = "Alloy"
grammar = "luau"
path_suffixes = ["aly", "alx"]
line_comments = ["-- "]
block_comment = ["--[[", "]]"]
autoclose_before = ";:.,=}])>"
tab_size = 4
hard_tabs = false
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
    { start = "`", end = "`", close = true, newline = false, not_in = ["string", "comment"] },
]
word_characters = ["_"]
