name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vscode:
    name: VS Code extension (lint, compile, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Package
        run: npm run package

  zed:
    name: Zed extension (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: zed
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          # Zed runs an extension as a wasm component.
          targets: wasm32-wasip1
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: zed
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --target wasm32-wasip1 -- -D warnings
      - name: Build
        run: cargo build --release --locked --target wasm32-wasip1
