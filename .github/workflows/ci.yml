name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vscode:
    name: VS Code extension (lint, compile, package)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vscode/package-lock.json
      - run: npm ci
      - name: Lint and check formatting
        run: npm run lint
      - name: Compile
        run: npm run compile
      - name: Package
        run: npm run package
