# Posts pushes and pull requests to Discord through the shared workflow
# in alloy-luau/alloy. A DISCORD_WEBHOOK secret or variable turns it on;
# prefer the secret, since a public log shows a variable's value.
name: Discord

on:
  push:
    branches: ["**"]
  pull_request_target:
    types: [opened, closed]

permissions: {}

jobs:
  notify:
    uses: alloy-luau/alloy/.github/workflows/discord.yml@main
    secrets: inherit
    with:
      webhook: ${{ vars.DISCORD_WEBHOOK }}
