# Posts pushes and pull requests to Discord through the shared workflow
# in alloy-luau/alloy, with the DISCORD_WEBHOOK secret.
name: Discord

on:
  push:
    branches: ["**"]
  pull_request_target:
    types: [opened, closed]

permissions: {}

jobs:
  notify:
    uses: alloy-luau/alloy/.github/workflows/discord.yml@main
    secrets: inherit
